    v.innerHTML = `<div class="prof">${cfg}
      <div class="row"><h2>Registros da turma</h2>
        <label class="row" for="f-et"><span class="note">Etapa</span>
          <select id="f-et">${ETS.map(e => `<option value="${e}" ${e === filtroEt ? "selected" : ""}>${esc(D.et[e].nome)}</option>`).join("")}</select></label>
        <label class="row" for="f-filtro"><span class="note">Turma</span>
          <select id="f-filtro"><option value="">Todas (${roster.length} alunos)</option>${
            turmas.map(t => `<option value="${esc(t)}" ${t === filtroTurma ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label></div>
      ${rows.length ? `<h3>Habilidades com menor aproveitamento · ${esc(D.et[filtroEt].nome)}${filtroTurma ? " · turma " + esc(filtroTurma) : ""}</h3>${diagHTML(diagTurma(rows), false)}
        <div class="tblwrap"><table class="roster"><thead>${head}</thead><tbody>${body}</tbody></table></div>
        <div class="legend"><span><span class="cell hi">62</span> lista corrigida, escore 50 ou mais</span><span><span class="cell lo">31</span> escore abaixo de 50</span><span><span class="cell wip">4…</span> em andamento (itens marcados)</span></div>
        <h2>Comparação da turma · ${esc(D.et[filtroEt].nome)}${filtroTurma ? " · turma " + esc(filtroTurma) : ""}</h2>${turmaHTML(rows, filtroEt)}`
        : `<div class="empty">Nenhum aluno registrado ainda. Alunos conectados ao Claude com acesso de <b>Colaborador</b> aparecem aqui assim que entram com o e-mail; os demais salvam no próprio aparelho e enviam o relatório.</div>`}
      <p class="note">Só você e quem tiver acesso de editor veem este painel. Alunos que abrem a página só com acesso de visualização, como pessoas de fora da organização pelo link público, salvam o progresso no próprio navegador e podem enviar o relatório pela aba Identificação.</p></div>`;
  }

  function renderAll() {
    if (showGate()) { renderStats(); renderGate(); renderEtapa(); return; }
    renderGate(); fixS();
    renderStats(); renderEtapa(); renderAulas(); renderId(); renderCal();
    if (S.tab === "prof") renderProf();
    renderBanner(); saveLocal();
  }

  // ---------- events ----------
  async function saveDom(raw) {
    const list = [...new Set(String(raw).split(/[,;\s]+/).map(s => s.trim().toLowerCase().replace(/^@/, "")).filter(Boolean))];
    const bad = list.find(d => !/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(d));
    if (bad) { cfgErr = `“${bad}” não parece um domínio. Use o formato escola.edu.br.`; cfgMsg = ""; renderProf(); return; }
    cfgErr = "";
    try { await db.doc("config/geral").set({ dominios: list, profHash: profHash === D.profHash ? "" : profHash }); cfgMsg = list.length ? "Domínio salvo." : "Restrição removida."; const f = document.getElementById("f-dom"); if (f) f.value = list.join(", "); }
    catch (e) { cfgErr = "Não foi possível salvar o domínio agora. Tente de novo."; }
    renderProf();
  }
  async function saveProfCode(raw) {
    const c = String(raw || "").trim();
    if (c && c.replace(/\s+/g, "").length < 6) { codeCfgErr = "Use pelo menos 6 caracteres."; codeCfgMsg = ""; renderProf(); return; }
    const h = c ? hashCode(c) : "";
    try { await db.doc("config/geral").set({ dominios, profHash: h }); profHash = h || D.profHash; codeCfgErr = ""; codeCfgMsg = c ? "Código salvo. Anote: ele não aparece de novo." : "Código inicial restaurado."; }
    catch (e) { codeCfgErr = "Não foi possível salvar o código agora. Tente de novo."; codeCfgMsg = ""; }
    renderProf();
  }
  document.addEventListener("submit", e => {
    if (e.target.id === "profForm") { e.preventDefault();
      const c = e.target.code ? e.target.code.value : "";
      if (hashCode(c) === profHash) { profMode = true; lsSet(KPROF, 1); gateProf = false; profErr = ""; S = blank(); S.etapa = ETS[ETS.length - 1]; fixS(); S.tab = "aulas"; S.mode = "gab"; renderAll(); window.scrollTo({ top: 0 }); }
      else { profErr = "Código incorreto. Confira com quem criou o app."; renderAll(); }
      return; }
    if (e.target.id === "codeCfgForm") { e.preventDefault(); saveProfCode(e.target.code.value); return; }
    if (e.target.id === "calForm") { e.preventDefault(); saveAgenda(+e.target.dataset.n, e.target.data.value, e.target.hora.value); return; }
    if (e.target.id === "gateForm") { e.preventDefault(); entrar(e.target.email.value); return; }
    if (e.target.id === "cfgForm") { e.preventDefault(); saveDom(e.target.dom.value); }
    if (e.target.id === "idForm") { e.preventDefault(); saveId(e.target.nome.value, e.target.turma.value); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && repOpen) { repOpen = false; renderRepView(); } });
  document.addEventListener("change", e => {
    if (e.target.id === "f-filtro") { filtroTurma = e.target.value; renderProf(); }
    if (e.target.id === "f-et") { filtroEt = +e.target.value; csvMsg = null; renderProf(); }
    if (e.target.dataset && e.target.dataset.bq != null) { renderStats(); renderWeeks(); }
  });
  // typed answers: type B keeps three digits; type D text stays in this browser
  document.addEventListener("input", e => {
    const el = e.target, a = S.etapa ? aula(selOf()) : null; if (!a || S.done[a.n]) return;
    if (el.dataset.bq != null) {
      const i = +el.dataset.bq, v = el.value.replace(/\D/g, "").slice(0, 3); if (el.value !== v) el.value = v;
      const r = answers(a.n); if (v === "") delete r[i]; else r[i] = +v;
      pendingCorrect = false; persist(); const cd = document.querySelector("#main .card"); if (cd) cd.outerHTML = cardHTML(a);
    }
    if (el.dataset.dq != null) {
      const i = +el.dataset.dq; S.dtx[a.n] = S.dtx[a.n] || {}; S.dtx[a.n][i] = el.value.slice(0, 2000); saveLocal();
      const cd = document.querySelector("#main .card"); if (cd) cd.outerHTML = cardHTML(a);
    }
  });
  document.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t || t.disabled) return;
    const a = S.etapa ? aula(selOf()) : null;
    if (t.dataset.etapa) { S.etapa = +t.dataset.etapa; pendingCorrect = false; calEdit = null; fixS(); if (S.tab === "prof") filtroEt = S.etapa; renderAll(); persist(); window.scrollTo({ top: 0 }); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; idMsg = ""; renderAll(); window.scrollTo({ top: 0 }); return; }
    if (t.dataset.wk != null) { const k = +t.dataset.wk, w = S.calWeek[S.etapa] || 0; S.calWeek[S.etapa] = k === 0 ? Math.max(0, nowWeek()) : Math.max(0, Math.min(LAST(), w + k)); calEdit = null; renderAll(); return; }
    if (t.dataset.calgo) {
      const n = +t.dataset.calgo, m = t.dataset.calmode; S.sel[S.etapa] = n; S.tab = "aulas"; pendingCorrect = false;
      if (m === "nova" && S.done[n]) { S.done[n] = false; S.ans[n] = {}; S.cur[n] = 0; S.sets[n] = sortear(n); S.tent[n] = tentOf(n) + 1; if (S.dtx[n]) delete S.dtx[n]; persist(); }
      S.mode = m === "resumo" ? "resumo" : "lista";
      renderAll(); saveLocal();
      if (m === "tri" && S.done[n]) setTimeout(toTri, 30); else document.getElementById("main").scrollIntoView({ block: "start" });
      return;
    }
    if (t.dataset.feito) { const k = t.dataset.feito; S.feito = S.feito || {}; if (S.feito[k]) delete S.feito[k]; else S.feito[k] = 1; renderCal(); persist(); return; }
    if (t.dataset.open) { S.sel[S.etapa] = +t.dataset.open; S.tab = "aulas"; pendingCorrect = false; renderAll(); window.scrollTo({ top: 0 }); return; }
    if (t.dataset.caledit) { calEdit = +t.dataset.caledit; calErr = ""; renderCal(); const f = document.getElementById("c-data"); if (f) f.focus(); return; }
    if (t.id === "calCancel") { calEdit = null; calErr = ""; renderCal(); return; }
    if (t.id === "calReset") { const n = calEdit; saveAgenda(n, "", ""); return; }
    if (t.id === "clearDom") { const f = document.getElementById("f-dom"); if (f) f.value = ""; saveDom(""); return; }
    if (t.id === "viewRep") { repOpen = true; renderRepView(); return; }
    if (t.id === "closeRep") { const lst = repOpen && repOpen.n; repOpen = false; renderRepView(); const b = document.getElementById(lst ? "telaLista" : "viewRep"); if (b) b.focus(); return; }
    if (t.id === "pdfRep") { pdfMsg = { ok: true, t: "Preparando o PDF…" }; renderId(); baixarPDF(); return; }
    if (t.id === "copyAddr") {
      const ok = () => { addrMsg = "endereço copiado"; renderId(); };
      try { navigator.clipboard.writeText(D.repEmail).then(ok, () => { addrMsg = "selecione o endereço e copie"; renderId(); }); } catch (e) { addrMsg = "selecione o endereço e copie"; renderId(); }
      return;
    }
    if (t.id === "copyRep") {
      const txt = relatorio();
      const done = ok => { repMsg = ok ? { ok: true, t: "Relatório copiado. Cole na mensagem para o professor" + (D.repEmail ? " (" + D.repEmail + ")." : ".") } : { ok: false, t: "Não foi possível copiar automaticamente. Selecione o texto abaixo e copie." }; repShow = !ok || repShow; renderId();
        if (!ok) { const ta = document.getElementById("repTxt"); if (ta) { ta.focus(); ta.select(); } } };
      try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (e) { done(false); }
      return;
    }
    if (t.id === "switchUser") { trocarAluno(); return; }
    if (t.id === "profOpen") { gateProf = true; profErr = ""; renderAll(); const f = document.getElementById("g-prof"); if (f) f.focus(); return; }
    if (t.id === "profCancel") { gateProf = false; profErr = ""; renderAll(); return; }
    if (t.id === "profExit") { profMode = false; lsDel(KPROF); S = blank(); fixS(); renderAll(); window.scrollTo({ top: 0 }); return; }
    if (t.id === "codeReset") { saveProfCode(""); return; }
    if (t.id === "useGuest") { if (!fromGuest) S = blank(); fixS(); guest = true; fromGuest = false; gateErr = ""; renderAll(); window.scrollTo({ top: 0 }); return; }
    if (t.id === "leaveGuest") { guest = false; fromGuest = true; gateErr = ""; renderAll(); window.scrollTo({ top: 0 }); return; }
    if (t.id === "importCode") {
      const r = lerCodigo((document.getElementById("g-code") || {}).value);
      if (r.err) { gateErr = r.err; renderAll(); return; }
      entrar(r.ok.email, r.ok); return;
    }
    if (t.id === "copyCode") {
      const txt = codigo();
      const done = ok => { codeMsg = ok ? { ok: true, t: "Código copiado." } : { ok: false, t: "Selecione o código abaixo e copie." }; codeShow = !ok || codeShow; renderId();
        if (!ok) { const ta = document.getElementById("codeTxt"); if (ta) { ta.focus(); ta.select(); } } };
      try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (e) { done(false); }
      return;
    }
    if (t.id === "editId") { editing = true; idMsg = ""; renderId(); return; }
    if (t.id === "cancelEdit") { editing = false; idErr = ""; draft = null; renderId(); return; }
    if (t.dataset.aula) { S.sel[S.etapa] = +t.dataset.aula; pendingCorrect = false; renderAll(); window.scrollTo({ top: 0 }); return; }
    if (t.id === "csvResp" || t.id === "csvTent") { csvMsg = { ok: true, t: "Preparando o arquivo…" }; renderProf(); exportarCSV(t.id === "csvResp" ? "resp" : "tent", profRows(), filtroEt); return; }
    if (t.id === "printRep") {
      // where printing is blocked the call returns at once: fall back to images
      const t0 = Date.now(); let ok = true; try { window.print(); } catch (e) { ok = false; }
      if (!ok || Date.now() - t0 < 250) { const bx = document.getElementById("imgBox"); gerarImagens().then(() => { const b2 = document.getElementById("imgBox"); if (b2) b2.insertAdjacentHTML("afterbegin", '<p class="warn">A impressão não está disponível nesta página. Use as imagens abaixo.</p>'); }); }
      return;
    }
    if (t.id === "imgRep") { gerarImagens(); return; }
    if (t.id === "imgClose") { const bx = document.getElementById("imgBox"), d2 = document.querySelector("#repView .repdoc"); if (bx) { bx.hidden = true; bx.innerHTML = ""; } if (d2) d2.hidden = false; return; }
    if (!a) return;
    if (t.dataset.goq != null) { const i = +t.dataset.goq; if (S.mode === "uma") { S.cur[a.n] = i; renderMain(); } else { if (S.mode === "resumo") { S.mode = "lista"; renderMain(); } const el = document.getElementById("q" + i); if (el) el.scrollIntoView({ block: "start", behavior: "smooth" }); } return; }
    if (t.dataset.dav != null) {
      const i = +t.dataset.dav, v = +t.dataset.v, r = answers(a.n); r[i] = v;
      if (S.done[a.n]) registraHist(a.n);
      renderAll(); persist(); const el = document.getElementById("q" + i); if (el) el.scrollIntoView({ block: "nearest" }); return;
    }
    if (t.dataset.q != null && t.dataset.o != null) {
      const i = +t.dataset.q, j = +t.dataset.o, r = answers(a.n);
      if (r[i] === j) delete r[i]; else r[i] = j;
      pendingCorrect = false;
      const fromSheet = t.classList.contains("sb");
      if (fromSheet && S.mode === "uma") S.cur[a.n] = i;
      renderAll(); persist();
      if (fromSheet && S.mode !== "uma") { const el = document.getElementById("q" + i); if (el) el.scrollIntoView({ block: "nearest" }); }
      return;
    }
    if (t.dataset.mode) { const fromResumo = S.mode === "resumo"; S.mode = t.dataset.mode; renderAll(); if (fromResumo) document.getElementById("main").scrollIntoView({ block: "start" }); return; }
    if (t.dataset.step) { S.cur[a.n] = Math.max(0, Math.min(NQ - 1, (S.cur[a.n] || 0) + +t.dataset.step)); renderAll(); return; }
    if (t.id === "correct") { if (nAns(a.n) < NQ) { pendingCorrect = true; renderMain(); } else { S.done[a.n] = true; registraHist(a.n); renderAll(); persist(); toTri(); } return; }
    if (t.id === "doCorrect") { pendingCorrect = false; S.done[a.n] = true; registraHist(a.n); renderAll(); persist(); toTri(); return; }
    if (t.dataset.goaula) { e.preventDefault(); S.sel[S.etapa] = +t.dataset.goaula; S.mode = "resumo"; renderAll(); document.getElementById("main").scrollIntoView({ block: "start" }); return; }
    if (t.dataset.totri) { e.preventDefault(); toTri(); return; }
    if (t.id === "cancel") { pendingCorrect = false; renderMain(); return; }
    if (t.id === "redo") { S.done[a.n] = false; S.ans[a.n] = {}; S.cur[a.n] = 0; S.sets[a.n] = sortear(a.n); S.tent[a.n] = tentOf(a.n) + 1; if (S.dtx[a.n]) delete S.dtx[a.n]; renderAll(); persist(); document.getElementById("main").scrollIntoView({ block: "start" }); return; }
    if (t.id === "telaLista") { repOpen = { n: a.n }; renderRepView(); return; }
    if (t.id === "pdfLista") { pdfL = { n: a.n, ok: true, t: "Preparando o PDF…" }; renderMain(); baixarPDFLista(a.n); return; }
    if (t.id === "redoFoco") { refazerFoco(a.n); return; }
    if (t.id === "novaSeq") { S.sets[a.n] = sortear(a.n); renderAll(); saveLocal(); return; }
    if (t.id === "resetAll") { pendingReset = true; renderReset(); return; }
    if (t.id === "resetNo") { pendingReset = false; renderReset(); return; }
    if (t.id === "resetYes") { pendingReset = false; AE().forEach(x => { [S.ans, S.done, S.cur, S.sets, S.tent, S.dtx, S.foco].forEach(o => { if (o) delete o[x.n]; }); }); renderAll(); persist(); return; }
  });

  renderAll();
  if (window.claude && typeof window.claude.use === "function") initCloud();
  else { cloud = "off"; renderAll(); }
})();

</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {}));
</script>
</body>
