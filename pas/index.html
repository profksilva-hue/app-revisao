<!doctype html>
<html lang="pt-BR">
<head>
<meta name="theme-color" content="#005084">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Revisão de Matemática para o PAS/UnB 2026: 12 aulas por etapa, listas com itens A, B, C e D e correção no padrão do PAS."><title>Revisão PAS/UnB 2026 · Matemática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* PAS app palette: deep blue and green inspired by the UnB identity, with a warm gold as highlight.
   Layout: answer-sheet app. Left rail = schedule; right = the open lesson with a sticky answer sheet. */
:root {
  --paper: #F3F6F5; --sheet: #FFFFFF; --ink: #0F2733; --ink-2: #4B606B; --rule: #D2DEDA;
  --pen: #0A4F86; --pen-soft: #E2EDF6;
  --mark: #0F7A4C; --mark-soft: #E0F2E9;
  --ok: #1F7A4A; --ok-soft: #E0F1E7;
  --bad: #B23A48; --bad-soft: #F7E3E6;
  --fig-bg: #FFFFFF;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0B1A1F; --sheet: #112429; --ink: #E3EEF0; --ink-2: #A3B7BD; --rule: #24393F;
  --pen: #79B6E6; --pen-soft: #15324A; --mark: #5FD39A; --mark-soft: #15352A;
  --ok: #6CCB92; --ok-soft: #173326; --bad: #F08A97; --bad-soft: #3B1D23; --fig-bg: #FFFFFF;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0B1A1F; --sheet: #112429; --ink: #E3EEF0; --ink-2: #A3B7BD; --rule: #24393F;
  --pen: #79B6E6; --pen-soft: #15324A; --mark: #5FD39A; --mark-soft: #15352A;
  --ok: #6CCB92; --ok-soft: #173326; --bad: #F08A97; --bad-soft: #3B1D23; --fig-bg: #FFFFFF;
  color-scheme: dark; }
:root { --band: #0B3B5E; --band-ink: #FFFFFF; --band-ink-2: #CFE3EE; --band-accent: #7FD3A4; --wash: #DDEBEF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --band: #0A2A3D; --wash: #0D2229; } }
:root[data-theme="dark"] { --band: #0A2A3D; --wash: #0D2229; }
body { background: linear-gradient(180deg, var(--wash) 0, var(--paper) 520px) var(--paper); background-color: var(--paper); }
.wrap .top { border-bottom: 0; padding-top: 6px; padding-bottom: 26px; background: var(--band);
  box-shadow: 0 0 0 100vmax var(--band); clip-path: inset(-40px -100vmax 0 -100vmax); }
.wrap .top .eyebrow { color: var(--band-ink-2); }
.wrap .top h1 { color: var(--band-ink); }
.wrap .top h1 .alg { color: var(--band-accent); }
.wrap .top .stat { border-color: transparent; }
.wrap .gate { margin-top: 32px; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 60px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

/* top */
.top { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: end; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
.eyebrow { font: 600 11.5px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
h1 { font-family: var(--f-display); font-stretch: 72%; font-weight: 800; font-size: clamp(30px, 5vw, 46px); line-height: 1; margin: 8px 0 0; letter-spacing: -.01em; text-wrap: balance; }
h1 .alg { color: var(--pen); }
h1 .geo { color: var(--mark); }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 9px 14px; min-width: 120px; }
.stat b { display: block; font: 600 22px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat small { color: var(--ink-2); font-size: 12px; }
.stat.count b { color: var(--mark); }

/* grid */
.grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; margin-top: 24px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0,1fr); } }

/* schedule rail */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 860px) { .rail { position: static; } }
.rail h2 { font: 700 13px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
.weeks { display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 860px) { .week { min-width: 260px; } .weeks { flex-direction: row; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; } .week { min-width: 240px; scroll-snap-align: start; } }
.week { border-left: 3px solid var(--rule); padding-left: 12px; }
.week.now { border-left-color: var(--mark); }
.week-h { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.week-h b, .week-h span { white-space: nowrap; }
.week-h .wt { flex-basis: 100%; white-space: normal; font-weight: 600; color: var(--pen); }
.week-h .wt.geo { color: var(--mark); } .week-h b { color: var(--ink); font-weight: 700; }
.now-tag { font: 700 10.5px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; background: var(--mark-soft); color: var(--mark); padding: 3px 6px; border-radius: 4px; }
.lesson { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; }
.lesson:hover { background: var(--sheet); border-color: var(--rule); }
.lesson[aria-current="true"] { background: var(--sheet); border-color: var(--pen); }
.lesson .num { font: 600 13px/1 var(--f-mono); color: var(--pen); }
.lesson .nm { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.chip { font: 600 11.5px/1 var(--f-mono); padding: 4px 7px; border-radius: 99px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.todo { color: var(--ink-2); border: 1px dashed var(--rule); }
.chip.go { color: var(--pen); background: var(--pen-soft); }
.chip.done { color: var(--ok); background: var(--ok-soft); }
.chip.low { color: var(--bad); background: var(--bad-soft); }
.reset-all { align-self: start; background: none; border: 0; color: var(--ink-2); font-size: 12.5px; text-decoration: underline; padding: 0; }
.confirm { font-size: 12.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 3px 9px; font-size: 12.5px; }
.confirm .danger { border-color: var(--bad); color: var(--bad); }

/* lesson panel */
.head { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.head .eyebrow { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.head h2 { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.08; margin: 0; text-wrap: balance; }
.head p { margin: 0; color: var(--ink-2); max-width: 70ch; font-size: 14px; }
.tip { background: var(--mark-soft); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--ink); max-width: 75ch; }
.tip b { color: var(--mark); }
.mode { display: flex; gap: 6px; flex-wrap: wrap; }
.mode button { border: 1px solid var(--rule); background: transparent; border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

.body { display: grid; grid-template-columns: minmax(0,1fr) 210px; gap: 22px; margin-top: 18px; align-items: start; }
@media (max-width: 1040px) { .body { grid-template-columns: minmax(0,1fr); } }

.qs { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.q { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px 22px 16px; scroll-margin-top: 16px; }
.q.right { border-color: var(--ok); }
.q.wrong { border-color: var(--bad); }
.q-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 10px; margin-bottom: 8px; }
.q-h b { font: 700 13px/1 var(--f-ui); letter-spacing: .1em; color: var(--pen); white-space: nowrap; }
.q-r { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.nv { font: 600 11.5px/1 var(--f-ui); padding: 4px 7px; border-radius: 4px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.nv1, .nv2 { color: var(--ok); }
.nv4, .nv5 { color: var(--bad); }
.ref { display: block; margin-top: 6px; font-size: 12px; color: var(--ink-2); font-style: italic; }
.pnv { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin: -2px 0 8px; }
.pnv b { color: var(--ink); font-variant-numeric: tabular-nums; }
.verdict { font: 700 12px/1 var(--f-ui); letter-spacing: .04em; padding: 4px 8px; border-radius: 4px; }
.verdict.ok { color: var(--ok); background: var(--ok-soft); }
.verdict.no { color: var(--bad); background: var(--bad-soft); }
.q .txt p { font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; margin: 0 0 8px; max-width: 70ch; text-align: justify; hyphens: auto; }
.q .cmd { font-family: var(--f-body); font-size: 16.5px; line-height: 1.55; margin: 12px 0 10px; font-weight: 600; max-width: 70ch; }
.fig { background: var(--fig-bg); border-radius: 8px; padding: 10px; margin: 10px 0; display: flex; justify-content: center; }
.fig img { max-height: 300px; width: auto; max-width: 100%; }
.tbl { overflow-x: auto; margin: 10px 0; }
.tbl table { border-collapse: collapse; font-size: 13.5px; margin: 0 auto; font-variant-numeric: tabular-nums; }
.tbl th { background: var(--pen); color: var(--sheet); font-weight: 600; padding: 6px 12px; }
.tbl td { padding: 6px 12px; border-bottom: 1px solid var(--rule); text-align: center; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 12px; align-items: center; text-align: left; background: transparent; border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; font-family: var(--f-body); font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--pen); }
.bub { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-2); display: grid; place-items: center; font: 700 12.5px/1 var(--f-ui); color: var(--ink-2); }
.opt[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.opt[aria-pressed="true"] .bub { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.opt:disabled { cursor: default; }
.opt.is-right { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-right .bub { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }

/* theory summary */
.resumo { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.resumo h3 { margin: 0 0 4px; font: 700 15px/1.3 var(--f-ui); color: var(--ink); }
.resumo p { margin: 0; font-family: var(--f-body); font-size: 16px; line-height: 1.6; max-width: 70ch; }
.r-con { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 24px; }
.r-con h3 { color: var(--pen); }
.r-form { background: var(--pen-soft); border-radius: 8px; padding: 14px 16px; }
.r-form ul, .r-at ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.r-form li { font-family: var(--f-body); font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.r-ex { border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.r-ex .sol { color: var(--ink); }
.r-at h3 { color: var(--mark); }
.r-at li { font-size: 14.5px; }

.blk { font: 700 10.5px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; color: var(--pen); background: var(--pen-soft); }
.blk.geo { color: var(--mark); background: var(--mark-soft); }
.report { display: flex; flex-direction: column; gap: 8px; }
.report textarea { width: 100%; min-height: 150px; font: 500 12.5px/1.45 var(--f-mono); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; resize: vertical; }
.info { background: var(--pen-soft); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; color: var(--ink); margin: 0; }

/* diagnostics */
.fbk { margin-top: 12px; border-top: 1px dashed var(--rule); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.fbk p { margin: 0; max-width: 72ch; }
.fbk .bad { color: var(--ink); background: var(--bad-soft); border-radius: 6px; padding: 7px 10px; }
.fbk .bad b { color: var(--bad); }
.fbk .sol b { color: var(--pen); }
.hab { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }
.ofc { font: 600 11px/1.3 var(--f-ui); color: var(--pen); background: var(--pen-soft); border-radius: 6px; padding: 3px 8px; letter-spacing: .02em; margin-right: auto; }
@media (max-width: 560px) { .q-h .ofc { order: 3; flex-basis: 100%; width: fit-content; max-width: 100%; } }
img.ofi { display: block; max-width: 100%; height: auto; margin: 10px auto; background: #fff; border-radius: 6px; }
img.ofi.pdf { width: 100%; max-width: 720px; border: 1px solid var(--rule); padding: 6px; box-sizing: border-box; }
img.ofi.alt { display: inline-block; margin: 0; max-height: 140px; width: auto; vertical-align: middle; }
img.ofi.load { min-height: 120px; background: linear-gradient(90deg, var(--pen-soft), var(--sheet), var(--pen-soft)); background-size: 200% 100%; animation: ofl 1.2s linear infinite; }
img.ofi.miss { min-height: 60px; }
@keyframes ofl { to { background-position: -200% 0; } }
.optl { color: var(--ink-2); font: 600 13px/1.2 var(--f-ui); }
.opts.pdfo { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.opts.pdfo .opt { grid-template-columns: 1fr; justify-items: center; padding: 9px 4px; }
.opts.pdfo .optl { display: none; }
.fonte { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--rule); padding-top: 10px; }
.fonte h4 { margin: 0; font: 700 11.5px/1.2 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.mode.sm button { font-size: 12px; padding: 5px 9px; }
.tri { background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--pen); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
.tri h3 { margin: 0; font: 700 18px/1.2 var(--f-display); color: var(--ink); }
.tri h4 { margin: 4px 0 0; font: 700 11.5px/1.2 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.tri p { margin: 0; }
.tri-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.tri-n { text-align: right; flex: none; }
.tri-n b { display: block; font: 700 34px/1 var(--f-mono); color: var(--pen); font-variant-numeric: tabular-nums; }
.tri-n small { font: 600 11px/1.2 var(--f-ui); color: var(--ink-2); }
.tscale { position: relative; height: 54px; margin: 6px 4px 0; }
.tscale .tb { position: absolute; top: 14px; height: 14px; display: flex; align-items: center; justify-content: center; border-right: 2px solid var(--sheet); box-sizing: border-box; }
.tscale .tb i { font-style: normal; font-size: 10px; color: var(--ink); }
.tb1 { background: color-mix(in srgb, var(--pen) 10%, transparent); }
.tb2 { background: color-mix(in srgb, var(--pen) 20%, transparent); }
.tb3 { background: color-mix(in srgb, var(--pen) 32%, transparent); }
.tb4 { background: color-mix(in srgb, var(--pen) 46%, transparent); }
.tb5 { background: color-mix(in srgb, var(--pen) 62%, transparent); }
.tscale .trange { position: absolute; top: 10px; height: 22px; border: 2px solid var(--mark); border-radius: 4px; box-sizing: border-box; }
.tscale .tmark { position: absolute; top: 0; height: 36px; width: 0; border-left: 3px solid var(--ink); }
.tscale .tmark b { position: absolute; top: -2px; left: 5px; font: 700 11px/1 var(--f-mono); color: var(--ink); }
.tscale .tax { position: absolute; top: 36px; left: 0; right: 0; height: 16px; }
.tscale .tax em { position: absolute; font: 500 10px/1 var(--f-mono); font-style: normal; color: var(--ink-2); transform: translateX(-50%); }
.tscale .tax em:nth-child(1) { left: 0; transform: none; }
.tscale .tax em:nth-child(2) { left: 46.67%; }
.tscale .tax em:nth-child(3) { left: 60%; }
.tscale .tax em:nth-child(4) { left: 73.33%; }
.tscale .tax em:nth-child(5) { left: 86.67%; }
.tscale .tax em:nth-child(6) { right: 0; transform: none; }
.tlev { font-size: 14.5px; line-height: 1.45; }
.tlev .note { display: block; margin-top: 2px; }
.tcoer { display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45; }
.tcoer p { border-radius: 8px; padding: 8px 10px; }
.tcoer .bad { background: var(--bad-soft); color: var(--ink); }
.tcoer .warnx { background: var(--mark-soft); }
.tcoer .ok-msg { background: var(--ok-soft); }
.tsum { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
.tsum b { color: var(--ink); font-family: var(--f-mono); }
.tcards { display: flex; flex-direction: column; gap: 10px; }
.tcard { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45; }
.tcard header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tcard header b { flex: 1 1 200px; font: 650 14px/1.3 var(--f-ui); }
.tst { font: 700 11px/1 var(--f-ui); letter-spacing: .04em; text-transform: uppercase; border-radius: 99px; padding: 4px 9px; }
.s-pri { border-left: 4px solid var(--bad); } .s-pri .tst { background: var(--bad-soft); color: var(--bad); }
.s-prox { border-left: 4px solid var(--mark); } .s-prox .tst { background: var(--mark-soft); color: var(--mark); }
.s-conf { border-left: 4px solid var(--pen); } .s-conf .tst { background: var(--pen-soft); color: var(--pen); }
.s-ok { border-left: 4px solid var(--ok); } .s-ok .tst { background: var(--ok-soft); color: var(--ok); }
.tq { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.tq small { display: block; color: var(--ink-2); font-size: 12.5px; }
.tq .dg { color: var(--ink); font-style: italic; }
.tenc { background: var(--paper); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; }
.tenc ul { margin: 4px 0; padding-left: 18px; }
.tgo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; min-height: 0; width: auto; }
.qlink { font-family: var(--f-mono); font-weight: 700; color: var(--pen); }
.lnk { background: none; border: 0; padding: 0; color: var(--pen); font: inherit; text-decoration: underline; cursor: pointer; }
.tri-s { margin: 0; font-size: 13.5px; }
.tri-s b { font-family: var(--f-mono); color: var(--pen); }
.tcomo { font-size: 13px; color: var(--ink-2); }
.tcomo p { margin: 6px 0 0; }
.tcomo summary { cursor: pointer; font-weight: 600; color: var(--ink); }
@media (max-width: 560px) { .tri { padding: 14px 12px; } .tri-n b { font-size: 28px; } }
.foco { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--rule); padding-top: 10px; }

: 3, "tb": null}, {"tp": "B", "g": "p3b1_ordenada", "h": "PAS3 MAT1", "hab": "Equação da reta e valor em um ponto", "t": ["Em um gráfico de altitude, o percurso de uma trilha é retilíneo e passa pelos pontos (16, 33) e (36, 93), em que x é a distância horizontal, em metros, e y, a altitude relativa, em metros."], "c": "Calcule a altitude relativa, em metros, no ponto de abscissa x = 96. Marque o resultado na folha de respostas.", "a": 273, "sol": "m = 60/20 = 3. y = 33 + 3·(96 − 16) = 273.", "eb": "usar Δx/Δy no coeficiente angular; esquecer o ponto de partida.", "nv": 3, "tb": null}, {"tp": "D", "g": "p3d1_perp", "h": "PAS3 MAT1", "hab": "Reta perpendicular e ponto de interseção", "t": ["Em um mapa digital, a reta r: x + 3y − 4 = 0 representa uma rodovia, e o ponto P(3, 5), uma casa. A prefeitura quer ligar a casa à rodovia pelo caminho mais curto."], "c": "Determine a equação da reta que contém esse caminho e as coordenadas do ponto em que ele encontra a rodovia. Justifique cada passo.", "mod": ["O caminho mais curto é perpendicular a r. Como m_r = −1/3, o caminho tem m = 3 e passa por P: y = 3x − 4.", "Resolvendo o sistema entre essa reta e r, obtém-se o ponto (8/5, 4/5)."], "crit": ["não justifica a perpendicularidade ou não chega à equação.", "obtém a equação da perpendicular, mas erra ou não calcula a interseção.", "justifica que o menor caminho é perpendicular, obtém a equação e o ponto de interseção corretamente."], "nv": 4, "tb": null}, {"tp": "D", "g": "p3d1_perp", "h": "PAS3 MAT1", "hab": "Reta perpendicular e ponto de interseção", "t": ["Em um mapa digital, a reta r: 2x + 3y − 6 = 0 representa uma rodovia, e o ponto P(−3, −1), uma casa. A prefeitura quer ligar a casa à rodovia pelo caminho mais curto."], "c": "Determine a equação da reta que contém esse caminho e as coordenadas do ponto em que ele encontra a rodovia. Justifique cada passo.", "mod": ["O caminho mais curto é perpendicular a r. Como m_r = −2/3, o caminho tem m = 3/2 e passa por P: y = (3/2)x + 7/2.", "Resolvendo o sistema entre essa reta e r, obtém-se o ponto (−9/13, 32/13)."], "crit": ["não justifica a perpendicularidade ou não chega à equação.", "obtém a equação da perpendicular, mas erra ou não calcula a interseção.", "justifica que o menor caminho é perpendicular, obtém a equação e o ponto de interseção corretamente."], "nv": 4, "tb": null}, {"tp": "D", "g": "p3d1_perp", "h": "PAS3 MAT1", "hab": "Reta perpendicular e ponto de interseção", "t": ["Em um mapa digital, a reta r: 2x + y + 5 = 0 representa uma rodovia, e o ponto P(3, −2), uma casa. A prefeitura quer ligar a casa à rodovia pelo caminho mais curto."], "c": "Determine a equação da reta que contém esse caminho e as coordenadas do ponto em que ele encontra a rodovia. Justifique cada passo.", "mod": ["O caminho mais curto é perpendicular a r. Como m_r = −2, o caminho tem m = 1/2 e passa por P: y = (1/2)x − 7/2.", "Resolvendo o sistema entre essa reta e r, obtém-se o ponto (−3/5, −19/5)."], "crit": ["não justifica a perpendicularidade ou não chega à equação.", "obtém a equação da perpendicular, mas erra ou não calcula a interseção.", "justifica que o menor caminho é perpendicular, obtém a equação e o ponto de interseção corretamente."], "nv": 4, "tb": null}], "base12": [8, 9, 10, 11, 16, 17, 18, 19, 30, 33, 35, 38]}, {"k": 2, "tema": "Sistemas 2×2 e sua interpretação geométrica", "hs": ["PAS3 MAT2"], "cont": "Resolução de sistemas lineares 2×2, classificação (determinado, indeterminado, impossível) e interpretação como retas concorrentes, coincidentes ou paralelas.", "foco": "Comparação de planos e tarifas (ponto de equilíbrio) e discussão de sistemas com parâmetro.", "dica": "Coeficientes proporcionais: retas paralelas ou coincidentes. O termo independente decide.", "res": {"c": [["Resolver", "Substituição (isole uma incógnita) ou adição (elimine uma incógnita somando múltiplos das equações)."], ["Classificar", "Concorrentes: solução única (SPD). Coincidentes: infinitas (SPI). Paralelas disti iano, x representa o consumo, em GB, e y, o valor mensal, em reais.", "Com base nessa situação, julgue os itens."], "btb": null, "t": ["Para um consumo maior que 30 GB, a operadora B é a mais barata."], "c": "", "a": 0, "sol": "A reta de A é mais inclinada (3 > 2); depois do ponto de encontro, ela fica acima da de B.", "nv": 3, "bl": "p3a2_planos#1"}, {"tp": "A", "g": "p3a2_planos", "h": "PAS3 MAT2", "hab": "Sistema 2×2 em contexto e interseção de retas", "base": ["Duas operadoras de internet móvel cobram, por mês, um valor fixo mais um valor por gigabyte consumido: a operadora A cobra R$ 50,00 mais R$ 3,00 por GB; a operadora B cobra R$ 80,00 mais R$ 2,00 por GB. Em um plano cartesiano, x representa o consumo, em GB, e y, o valor mensal, em reais.", "Com base nessa situação, julgue os itens."], "btb": null, "t": ["O ponto de interseção das retas que representam os dois planos é (30, 140)."], "c": "", "a": 0, "sol": "Com x = 30: y = 50 + 3·30 = 140.", "nv": 3, "bl": "p3a2_planos#1"}, {"tp": "A", "g": "p3a2_planos", "h": "PAS3 MAT2", "hab": "Sistema 2×2 em contexto e interseção de retas", "base": ["Duas operadoras de internet móvel cobram, por mês, um valor fixo mais um valor por gigabyte consumido: a operadora A cobra R$ 50,00 mais R$ 3,00 por GB; a operadora B cobra R$ 80,00 mais R$ 2,00 por GB. Em um plano cartesiano, x representa o consumo, em GB, e y, o valor mensal, em reais.", "Com base nessa situação, julgue os itens."], "btb": null, "t": ["As retas que representam os planos são paralelas, pois ambas têm valor fixo positivo."], "c": "", "a": 1, "sol": "O paralelismo depende dos coeficientes angulares, que são diferentes: as retas são concorrentes.", "nv": 3, "bl": "p3a2_planos#1"}, {"tp": "A", "g": "p3a2_planos", "h": "PAS3 MAT2", "hab": "Sistema 2×2 em contexto e interseção de retas", "base": ["Duas operadoras de internet móvel cobram, por mês, um valor fixo mais um valor por gigabyte consumido: a operadora A cobra R$ 50,00 mais R$ 3,00 por GB; a operadora B cobra R$ 100,00 mais R$ 1,00 por GB. Em um plano cartesiano, x representa o consumo, em GB, e y, o valor mensal, em reais.", "Com base nessa situação, julgue os itens."], "btb": null, "t": ["O consumo em que as duas operadoras cobram o mesmo valor é de 25 GB."], "c": "", "a": 0, "sol": "50 + 3x = 100 + 1x ⇒ 2x = 50 ⇒ x = 25.", "nv": 3, "bl": "p3a2_planos#2"}, {"tp": "A", "g": "p3a2_planos", "h": "PAS3 MAT2", "hab": "Sistema 2×2 em contexto e interseção de retas", "base": ["Duas operadoras de internet móvel cobram, por mês, um valor fixo mais um valor por gigabyte consumido: a operadora A cobra R$ 50,00 mais R$ 3,00 por GB; a operadora B cobra R$ 100,00 mais R$ 1,00 por GB. Em um plano cartesiano, x representa o consumo, em GB, e y, o valor mensal, em reais.", "Com base nessa situação, julgue os itens."], "btb": null, "t": ["Para um consumo maior que 25 GB, a operadora A é a mais barata."], "c": "", "a": 1, "sol": "Depois de 25 GB, a reta de A, mais inclinada, fica acima: B é mais barata.", "nv": 3, "bl": "p3a2_planos#2"}, {"tp": "A", "g": "p3a2_planos", "h": "PAS3 MAT2", "hab": "Sistema 2×2 em contexto e interseção de retas", "base": ["Duas operadoras de internet móvel cobram, por mês, um valor fixo mais um valor por gigabyte consumido: a operadora A cobra R$ 50,00 mais R$ 3,00 por GB; a operadora B cobra R$ 100,00 mais R$ 1,00 por GB. Em um plano cartesiano, x representa o consumo, em GB, e y, o valor mensal, em reais.", "Com base nessa situação, julgue os itens."], "btb": null, "t": ["O ponto de interseção das retas que representam os dois planos é (125, 25)."], "c": "", "a": 1, "sol": "x é o consumo e y o valor: o ponto é (25, 125).", "nv": 3, "bl": "p3a2_planos#2"}, {"tp": "A", "g": "p3a2_planos", "h": "PAS3 MAT2", "hab": "Sistema 2×2 em contexto e interseção de retas", "base": ["Duas operadoras de internet móvel cobram, por mês, um valor fixo mais um valor por gigabyte consumido: a operadora A cobra R$ 50,00 mais R$ 3,00 por GB; a operadora B cobra R$ 100,00 mais R$ 1,00 por GB. Em um plano cartesiano, x representa o consumo, em GB, e y, o valor mensal, em reais.", "Com base nessa situação, julgue os itens."], "btb": null, "t": ["As retas que representam os planos são paralelas, pois ambas têm valor fixo positivo."], "c": "", "a": 1, "sol": "O paralelismo depende dos coeficientes angulares, que são diferentes: as retas são concorrentes.", "nv": 3, "bl": "p3a2_planos#2"}, {"tp": "C", "g": "p3c2_param", "h": "PAS3 MAT2", "hab": "Sistema 2×2 com parâmetro", "t": ["Considere o sistema formado pelas equações x + 2y = 4 e 3x + ky = 13, em que k é um número real."], "c": "O sistema é possível e determinado se, e somente se,", "o": ["k ≠ 6", "k = 6", "k = 3", "k = 2"], "a": 0, "e": ["", "Trocou a condição: com k igual, as retas são paralelas; com k diferente, concorrentes.", "Usou o coeficiente de x em vez do de y.", "Comparou com o coeficiente da primeira equação sem considerar a proporção."], "sol": "As retas são paralelas quando os coeficientes de x e y são proporcionais: 3/1 = k/2 ⇒ k = 6. Nesse caso, os termos independentes (13 e 12) não são proporcionais: sistema impossível. Para k ≠ 6, as retas são concorrentes: possível e determinado.", "nv": 4, "tb": null}, {"tp": "C", "g": "p3c2_param", "h": "PAS3 MAT2", "hab": "Sistema 2×2 com parâmetro", "t": ["Considere o sistema formado pelas equações 2x + 2y = 7 e 4x + ky = 15, em que k é um número real."], "c": "O sistema é impossível se, e somente se,", "o": ["k = 2", "k ≠ 4", "k = −4", "k = 4"], "a": 3, "e": ["Comparou com o coeficiente da primeira equação sem considerar a proporção.", "Trocou a condição: com k igual, as retas são paralelas; com k diferente, concorrentes.", "Errou o sinal na proporção.", ""], "sol": "As retas são paralelas quando os coeficientes de x e y são proporcionais: 4/2 = k/2 ⇒ k = 4. Nesse caso, os termos independentes (15 e 14) não são proporcionais: sistema impossível. Para k ≠ 4, as retas são concorrentes: possível e determinado.", "nv": 4, "tb": null}, {"tp": "C", "g": "p3c2_param", "h": "PAS3 MAT2", "hab": "Sistema 2×2 com parâmetro", "t": ["Considere o sistema formado pelas equações 3x + 4y = 8 e 9x + ky = 25, em que k é um número real."], "c": "O sistema é possível e determinado se, e somente se,", "o": ["k = 12", "k ≠ 12", "k = 9", "k = 4"], "a": 1, "e": ["Trocou a condição: com k igual, as retas são paralelas; com k diferente, concorrentes.", "", "Usou o coeficiente de x em vez do de y.", "Comparou com o coeficiente da primeira equação sem considerar a proporção."], "sol": "As retas são paralelas quando os coeficientes de x e y são proporcionais: 9/3 = k/4 ⇒ k = 12. Nesse caso, os termos independentes (25 e 24) não são proporcionais: sistema impossível. Para k ≠ 12, as retas são concorrentes: possível e determinado.", "nv": 4, "tb": null}, {"tp": "C", "g": "p3c2_mistura", "h": "PAS3 MAT2", "hab": "Sistema 2×2 em contexto", "t": ["Em uma sessão de cinema foram vendidos 60 ingressos, de meia-entrada a R$ 4,00 e inteiros a R$ 9,00, arrecadando R$ 400,00."], "c": "Foram vendidos", "o": ["32 ingressos de meia e 28 inteiras", "30 ingressos de meia e 30 inteiras", "25 ingressos de meia e 35 inteiras", "28 ingressos de meia e 32 inteiras"], "a": 3, "e": ["Trocou as incógnitas ao responder.", "Dividiu igualmente sem usar a arrecadação.", "Errou o sinal na substituição.", ""], "sol": "x + y = 60 e 4x + 9y = 400. Com y = 60 − x: 4x + 540 − 9x = 400 ⇒ x = 28 e y = 32.", "nv": 2, "tb": null}, {"tp": "C", "g": "p3c2_mistura", "h": "PAS3 MAT2", "hab": "Sistema 2×2 em contexto", "t": ["Em uma sessão de cinema foram vendidos 30 ingressos, de meia-entrada a R$ 6,00 e inteiros a R$ 9,00, arrecadando R$ 210,00."], "c": "Foram vendidos", "o": ["10 ingressos de meia e 20 inteiras", "22 ingressos de meia e 8 inteiras", "15 ingressos de meia e 15 inteiras", "20 ingressos de meia e 10 inteiras"], "a": 3, "e": ["Trocou as incógnitas ao responder.", "Errou a conta ao isolar a incógnita.", "Dividiu igualmente sem usar a arrecadação.", ""], "sol": "x + y = 30 e 6x + 9y = 210. Com y = 30 − x: 6x + 270 − 9x = 210 ⇒ x = 20 e y = 10.", "nv": 2, "tb": null}, {"tp": "C", "g": "p3c2_mistura", "h": "PAS3 MAT2", "hab": "Sistema 2×2 em contexto", "t": ["Em uma sessão de cinema foram vendidos 50 ingressos, de meia-entrada a R$ 5,00 e inteiros a R$ 10,00, arrecadando R$ 330,00."], "c": "Foram vendidos", "o": ["36 ingressos de meia e 14 inteiras", "16 ingressos de meia e 34 inteiras", "25 ingressos de meia e 25 inteiras", "34 ingressos de meia e 16 inteiras"], "a": 3, "e": ["Errou a conta ao isolar a incógnita.", "Trocou as incógnitas ao responder.", "Dividiu igualmente sem usar a arrecadação.", ""], "sol": "x + y = 50 e 5x + 10y = 330. Com y = 50 − x: 5x + 500 − 10x = 330 ⇒ x = 34 e y = 16.", "nv": 2, "tb": null}, {"tp": "B", "g": "p3b2_intersecao", "h": "PAS3 MAT2", "hab": "Ponto de interseção de duas retas", "t": ["As retas r: 3x + 2y = 225 e s: 2x − 2y = 40 se cortam no ponto (a, b)."], "c": "Calcule o valor de a + b. Marque o resultado na folha de respostas.", "a": 86, "sol": "Resolvendo o sistema: x = 53 e y = 33. Logo, a + b = 86.", "eb": "trocar sinais na eliminação; somar as equações sem igualar coeficientes.", "nv": 3, "tb": null}, {"tp": "B", "g": "p3b2_intersecao", "h": "PAS3 MAT2", "hab": "Ponto de interseção de duas retas", "t": ["As retas r: 3x + 2y = 158 e s: x − 2y = −14 se cortam no ponto (a, b)."], "c": "Calcule o valor de a + b. Marque o resultado na folha de respostas.", "a": 61, "sol": "Resolvendo o sistema: x = 36 e y = 25. Logo, a + b = 61.", "eb": "trocar sinais na eliminação; somar as equações sem igualar coeficientes.", "nv": 3, "tb": null}, {"tp": "B", "g": "p3b2_intersecao", "h": "PAS3 MAT2", "hab": "Ponto de interseção de duas retas", "t": ["As retas r: 2x + y = 58 e s: 2x − 2y = −32 se cortam no ponto (a, b)."], "c": "Calcule o valor de a + b. Marque o resultado na folha de respostas.", "a": 44, "sol": "Resolvendo o sistema: x = 14 e y = 30. Logo, a + b = 44.", "eb": "trocar sinais na eliminação; somar as equações sem igualar coeficientes.", "nv": 3, "tb": null}, {"tp": "B", "g": "p3b2_intersecao", "h": "PAS3 MAT2", "hab": "Ponto de interseção de duas retas", "t": ["As retas r: 3x + y = 75 e s: x − y = −15 se cortam no ponto (a, b)."], "c": "Calcule o valor de a + b. Marque o resultado na folha de respostas.", "a": 45, "sol": "Resolvendo o sistema: x = 15 e y = 30. Logo, a + b = 45.", "eb": "trocar sinais na eliminação; somar as equações sem igualar coeficientes.", "nv": 3, "tb": null}, {"tp": "D", "g": "p3d2_classifica", "h": "PAS3 MAT2", "hab": "Discussão de sistema 2×2", "t": ["Considere o sistema x + 2y = 9 e 2x + my = n, em que m e n são números reais."], "c": "Determine os valores de m e n para que o sistema seja: (a) possível e indeterminado; (b) impossível; (c) possível e determinado. Interprete cada caso geometricamente.", "mod": ["Multiplicando a primeira equação por 2: 2x + 4y = 18.", "(a) m = 4 e n = 18: as retas coincidem (infinitas soluções). (b) m = 4 e n ≠ 18: retas paralelas distintas (nenhuma solução). (c) m ≠ 4 (n qualquer): retas concorrentes (solução única)."], "crit": ["não relaciona os casos à proporcionalidade dos coeficientes.", "acerta parte dos casos ou não faz a interpretação geométrica.", "determina corretamente os três casos e interpreta cada um como retas coincidentes, paralelas ou concorrentes."], "nv": 4, "tb": null}, {"tp": "D", "g": "p3d2_classifica", "h": "PAS3 MAT2", "hab": "Discussão de sistema 2×2", "t": ["Considere o sistema 2x + 2y = 6 e 4x + my = n, em que m e n são números reais."], "c": "Determine os valores de m e n para que o sistema seja: (a) possível e indeterminado; (b) impossível; (c) possível e determinado. Interprete cada caso geometricamente.", "mod": ["Multiplicando a primeira equação por 2: 4x + 4y = 12.", "(a) m = 4 e n = 12: as retas coincidem (infinitas soluções). (b) m = 4 e n ≠ 12: retas paralelas distintas (nenhuma solução). (c) m ≠ 4 (n qualquer): retas concorrentes (solução única)."], "crit": ["não relaciona os casos à proporcionalidade dos coeficientes.", "acerta parte dos casos ou não faz a interpretação geométrica.", "determina corretamente os três casos e interpreta cada um como retas coincidentes, paralelas ou concorrentes."], "nv": 4, "tb": null}, {"tp": "D", "g": "p3d2_classifica", "h": "PAS3 MAT2", "hab": "Discussão de sistema 2×2", "t": ["Considere o sistema 2x + 3y = 5 e 4x + my = n, em que m e n são números reais."], "c": "Determine os valores de m e n para que o sistema seja: (a) possível e indeterminado; (b) impossível; (c) possível e determinado. Interprete cada caso geometricamente.", "mod": ["Multiplicando a primeira equação por 2: 4x + 6y = 10.", "(a) m = 6 e n = 10: as retas coincidem (infinitas soluções). (b) m = 6 e n ≠ 10: retas paralelas distintas (nenhuma solução). (c) m ≠ 6 (n qualquer): retas concorrentes (solução única)."], "crit": ["não relaciona os casos à proporcionalidade dos coeficientes.", "acerta parte dos casos ou não faz a interpretação geométrica.", "determina corretamente os três casos e interpreta cada um como retas coincidentes, paralelas ou concorrentes."], "nv": 4, "tb": null}], "base12": [0, 1, 2, 3, 20, 21, 22, 23, 31, 29, 35, 40]}, {"k": 3, "tema": "Distâncias e circunferência", "hs": ["PAS3 MAT4"], "cont": "Distância entre dois pontos, de ponto a reta e entre retas paralelas; equação reduzida e geral da circunferência; posição de pontos e retas.", "foco": "Antenas, irrigadores e coberturas circulares; menor caminho até uma estrada (distância ponto–reta).", "dica": "Na equação (x − a)² + (y − b)² = r², o centro tem sinais opostos aos que aparecem nos parênteses.", "res": {"c": [["Distâncias", "Entre pontos: √(Δx² + Δy²). De ponto a reta: |ax₀ + by₀ + c|/√(a² + b²), medida pela perpendicular."], ["Circunferência", "Pontos a distância r do centro (a, b): (x − a)² + (y − b)² = r². Na forma geral x² + y² + Dx + Ey + F = 0, o centro é (−D/2, −E/2) e r² = a² + b² − F."], ["Posições", "Ponto interior , "nv": 3, "bl": "p3a9_forcas#2"}, {"tp": "C", "g": "p3c9_polar", "h": "PAS3 MAT9", "hab": "Conversão da forma algébrica para a polar", "t": ["Considere o número complexo z = 1 + √3i."], "c": "A forma polar de z é", "o": ["4(cos 60° + i sen 60°)", "2(cos 60° + i sen 60°)", "2(cos 30° + i sen 30°)", "2(cos 240° + i sen 240°)"], "a": 1, "e": ["Usou o quadrado do módulo.", "", "Trocou seno e cosseno ao calcular o argumento.", "Errou o quadrante: o argumento está 180° deslocado."], "sol": "ρ = |z| = 2; cos θ = 1/2 e sen θ = √3/2 ⇒ θ = 60°.", "nv": 4, "tb": null}, {"tp": "C", "g": "p3c9_polar", "h": "PAS3 MAT9", "hab": "Conversão da forma algébrica para a polar", "t": ["Considere o número complexo z = −2√3 − 2i."], "c": "A forma polar de z é", "o": ["4(cos 30° + i sen 30°)", "4(cos 240° + i sen 240°)", "16(cos 210° + i sen 210°)", "4(cos 210° + i sen 210°)"], "a": 3, "e": ["Errou o quadrante: o argumento está 180° deslocado.", "Trocou seno e cosseno ao calcular o argumento.", "Usou o quadrado do módulo.", ""], "sol": "ρ = |z| = 4; cos θ = −√3/2 e sen θ = −1/2 ⇒ θ = 210°.", "nv": 4, "tb": null}, {"tp": "C", "g": "p3c9_polar", "h": "PAS3 MAT9", "hab": "Conversão da forma algébrica para a polar", "t": ["Considere o número complexo z = −√3 + 1i."], "c": "A forma polar de z é", "o": ["2(cos 330° + i sen 330°)", "4(cos 150° + i sen 150°)", "2(cos 150° + i sen 150°)", "2(cos 300° + i sen 300°)"], "a": 2, "e": ["Errou o quadrante: o argumento está 180° deslocado.", "Usou o quadrado do módulo.", "", "Trocou seno e cosseno ao calcular o argumento."], "sol": "ρ = |z| = 2; cos θ = −√3/2 e sen θ = 1/2 ⇒ θ = 150°.", "nv": 4, "tb": null}, {"tp": "C", "g": "p3c9_potencia", "h": "PAS3 MAT9", "hab": "Potência pela fórmula de De Moivre", "t": ["Seja z = cos 30° + i sen 30°."], "c": "O valor de z^8 é", "o": ["−1", "i", "−1/2 + (−√3/2)i", "1"], "a": 2, "e": ["Errou o argumento final n·θ (lembre de reduzir a 0° a 360°).", "Errou o argumento final n·θ (lembre de reduzir a 0° a 360°).", "", "Er a forma polar", "t": ["Considere z₁ = 4(cos 20° + i sen 20°) e z₂ = 4(cos 40° + i sen 40°)."], "c": "Calcule o módulo de z₁·z₂. Marque o resultado na folha de respostas.", "a": 16, "sol": "|z₁·z₂| = |z₁|·|z₂| = 4·4 = 16.", "eb": "somar os módulos.", "nv": 2, "tb": null}, {"tp": "B", "g": "p3b9_mod", "h": "PAS3 MAT9", "hab": "Módulo de produto e potência na forma polar", "t": ["Considere z₁ = 3(cos 20° + i sen 20°) e z₂ = 4(cos 40° + i sen 40°)."], "c": "Calcule o módulo de (z₁)²·z₂. Marque o resultado na folha de respostas.", "a": 36, "sol": "|z₁²·z₂| = 3²·4 = 36.", "eb": "multiplicar o módulo por 2 em vez de elevar ao quadrado.", "nv": 3, "tb": null}, {"tp": "D", "g": "p3d9_raizes", "h": "PAS3 MAT9", "hab": "Raízes da unidade e forma polar", "t": ["Considere a equação zⁿ = 1 com n = 4, no conjunto dos complexos."], "c": "Usando a forma polar, determine todas as soluções, represente-as no plano de Argand-Gauss e explique por que elas formam um polígono regular. Calcule também a soma dessas soluções.", "mod": ["z = cos(360°k/4) + i sen(360°k/4), k = 0, …, 3: 1, i, −1, −i.", "Todas têm módulo 1 e argumentos espaçados de 90°: são vértices de um polígono regular de 4 lados inscrito na circunferência unitária. A soma é 0 (os vetores se anulam por simetria)."], "crit": ["não usa a forma polar ou encontra só a raiz 1.", "encontra as raízes, mas não justifica o polígono regular ou a soma.", "obtém as 4 raízes, justifica o polígono regular pelos argumentos igualmente espaçados e mostra que a soma é 0."], "nv": 5, "tb": null}, {"tp": "D", "g": "p3d9_raizes", "h": "PAS3 MAT9", "hab": "Raízes da unidade e forma polar", "t": ["Considere a equação zⁿ = 1 com n = 3, no conjunto dos complexos."], "c": "Usando a forma polar, determine todas as soluções, represente-as no plano de Argand-Gauss e explique por que elas formam um polígono regular. Calcule também a soma dessas soluções.", "mod": ["z = cos(360°k/3) + i sen(360°k/3), k = 0, …, 2: 1, −1/2 + (√3/2)i, −1/2 − (√3/2)i.", "Todas   const DOW = ["seg", "ter", "qua", "qui", "sex", "sáb", "dom"];

  const addD = (s, k) => { const d = parseD(s); d.setDate(d.getDate() + k); return iso(d); };

  const ddmm = s => s.slice(8, 10) + "/" + s.slice(5, 7);
  const W = () => ETD().weeks, MON = () => W().map(w => w[0]), LAST = () => W().length - 1;

  const EVT = Object.assign({ "2026-11-02": ["feriado", "Feriado", "Finados"], "2026-11-08": ["outro", "ENEM · 1º dia", "Linguagens, Humanas e Redação"],
    "2026-11-15": ["outro", "ENEM · 2º dia", "Natureza e Matemática (feriado)"], "2026-11-20": ["feriado", "Feriado", "Consciência Negra"] },

  const selOf = () => S.sel[S.etapa];

  // ---------- itens e listas no padrão do PAS ----------
  // each list: 2 texts with 4 items of type A each, 2 of type C, 1 of type B and 1 of type D
  const NQ = 12;

  const pool = a => a.bank;

  const qObj = x => !!x && typeof x === "object" && !!x.tp && Array.isArray(x.t);
  const setOf = (n, sets) => { const a = aula(n), s = sets && sets[n]; return Array.isArray(s) && s.length === NQ && s.every(i => (Number.isInteger(i) && pool(a)[i]) || qObj(i)) ? s : a.base12; };
  const qsOf = (n, sets) => setOf(n, sets).map(i => qObj(i) ? i : pool(aula(n))[i]);
  const QS = a => qsOf(a.n, S.sets);
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const NV = ["", "Muito fácil", "Fácil", "Média", "Difícil", "Muito difícil"];
  const NVI = ["", "❶", "❷", "❸", "❹", "❺"];
  const nvOf = q => q.nv || 3;
  const vazio = r => r == null || r === "";
  // scoring of the edital: A +x/−x, B +2x, C +2x/−0,667x, D up to 3x (here self-assessed: 0, 1,5x or 3x)
  function unid(q, r) {
    if (vazio(r)) return 0;
    if (q.tp === "A") return r === q.a ? 1 : -1;
    if (q.tp === "B") return +r === q.a ? 2 : 0;
    if (q.tp === "C") return r === q.a ? 2 : -0.667;

  }
  const certo = (q, r) => !vazio(r) && (q.tp === "D" ? r === 2 : q.tp === "B" ? +r === q.a : r === q.a);
  const r1 = v => Math.round(v * 10) / 10;
  function placar(n, ans, sets) {
    const r = (ans && ans[n]) || {}, qs = qsOf(n, sets === undefined ? S.sets : sets);
    const x = 100 / qs.reduce((s, q) => s + MAXU[q.tp], 0);
    const its = qs.map((q, i) => ({ q, i, r: r[i], u: unid(q, r[i]), mx: MAXU[q.tp], ok: certo(q, r[i]), br: vazio(r[i]) }));
    const tot = its.reduce((s, it) => s + it.u, 0);
    const porTp = {};
    its.forEach(it => { const t = porTp[it.q.tp] = porTp[it.q.tp] || { tp: it.q.tp, n: 0, c: 0, e: 0, b: 0, u: 0, mx: 0 }; t.n++; t.u += it.u; t.mx += it.mx; if (it.br) t.b++; else if (it.ok || (it.q.tp === "D" && it.u > 0)) t.c++; else t.e++; });
    // the score had the wrong A and C items been left blank: the cost of guessing
    const semChute = its.reduce((s, it) => s + (!it.br && !it.ok && (it.q.tp === "A" || it.q.tp === "C") ? 0 : it.u), 0);
    const perdaChute = its.filter(it => !it.br && !it.ok && (it.q.tp === "A" || it.q.tp === "C")).length;
    const dPend = its.some(it => it.q.tp === "D" && it.br);
    return { its, x, esc: r1(tot * x), semChute: r1(semChute * x), perdaChute, porTp, ac: its.filter(it => it.ok).length, dPend };
  }
  const scoreOf = n => placar(n, S.ans).esc;
  const fmtE = v => (v < 0 ? "−" : "") + String(Math.abs(v)).replace(".", ",");
  const tentOf = n => (S.tent && S.tent[n]) || 1;
  // two texts with four A items each, then 2 C, 1 B and 1 D; avoids repeating the previous draw
  function sortear(n, pesos) {
    const P = pool(aula(n)), prev = new Set(setOf(n, S.sets).filter(Number.isInteger));
    const w = q => (pesos ? (pesos[q.h] || 0) : 0) + Math.random();
    const blocos = {};
    P.forEach((q, i) => { if (q.tp === "A") (blocos[q.bl] = blocos[q.bl] || []).push(i); });
    const bl = Object.values(blocos).filter(l => l.length === 4).map(l => ({ l, g: P[l[0]].g, novo: !l.some(i => prev.has(i)), w: l.reduce((s, i) => s + w(P[i]), 0) / 4 }))
      .sort((x, y) => (y.novo - x.novo) || (y.w - x.w));
    const out = [];
    const b1 = bl[0], b2 = bl.find(b => b !== b1 && b.g !== b1.g) || bl.find(b => b !== b1);
    [b1, b2].forEach(b => { if (b) out.push(...b.l); });
    const pick = (tp, k) => {
      const c = P.map((q, i) => ({ q, i })).filter(x => x.q.tp === tp).map(x => Object.assign(x, { novo: !prev.has(x.i), w: w(x.q) })).sort((x, y) => (y.novo - x.novo) || (y.w - x.w));
      const gs = new Set();
      c.forEach(x => { if (k > 0 && !gs.has(x.q.g)) { out.push(x.i); gs.add(x.q.g); k--; } });
      c.forEach(x => { if (k > 0 && !out.includes(x.i)) { out.push(x.i); k--; } });
    };
    pick("C", 2); pick("B", 1); pick("D", 1);
    return out.length === NQ ? out : aula(n).base12;
  }
  // per skill: points earned against the maximum, over corrected lists of the current etapa
  function diag(ans, done, sets, et) {
    const by = {};
    AE(et).forEach(a => {
      if (!done || !done[a.n]) return;
      placar(a.n, ans, sets === undefined ? S.sets : sets).its.forEach(it => {
        const hk = it.q.h || "?";
        const g = by[hk] = by[hk] || { h: hk, u: 0, mx: 0, tot: 0, err: 0, aulas: new Set() };
        g.u += it.u; g.mx += it.mx; g.tot++;

    });
    return Object.values(by).map(g => Object.assign(g, { s: g.u / g.mx })).filter(g => g.err > 0).sort((x, y) => x.s - y.s || y.err - x.err);
  }
  const STN = ["Prioridade", "Em desenvolvimento", "Consolidada"];

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  function notas() { const o = {}; Object.keys(S.done).forEach(k => { if (S.done[k]) o[k] = scoreOf(+k); }); return o; }

  // persist: local always; cloud when identified

  function mergeHist(a, b) { const m = {}; (a || []).concat(b || []).forEach(h => { if (h && h.a) { const k = h.a + "-" + h.t; if (!m[k] || (h.d || "") > (m[k].d || "")) m[k] = h; } }); return Object.values(m).sort((x, y) => (x.d || "").localeCompare(y.d || "")); }

  // the shared text of a block of type A items appears before its first item
  function baseHTML(qs, i, one) {

  function qHTML(a, qs, i, gab, one) {

    const cls = gab ? " right" : done ? (q.tp === "D" ? (br ? " pend" : it.u >= 3 ? " right" : it.u > 0 ? " part" : " wrong") : ok ? " right" : br ? " blank" : " wrong") : "";
    const gabTxt = q.tp === "A" ? CE[q.a] : q.tp === "B" ? String(q.a).padStart(3, "0") : q.tp === "C" ? L[q.a] : "";
    const verdict = gab ? `<span class="verdict ok">Gabarito ${q.tp === "D" ? "comentado" : gabTxt}</span>`
      : !done ? "" : q.tp === "D" ? (br ? '<span class="verdict pend">Autoavalie abaixo</span>' : `<span class="verdict ${it.u >= 3 ? "ok" : it.u > 0 ? "part" : "no"}">${["Insuficiente", "Parcial", "Completa"][r]} · ${ptsTxt(it.u, P.x)}</span>`)
      : ok ? `<span class="verdict ok">Certo · ${ptsTxt(it.u, P.x)}</span>` : br ? `<span class="verdict bl">Em branco · gabarito ${gabTxt}</span>` : `<span class="verdict no">Errou · gabarito ${gabTxt} · ${ptsTxt(it.u, P.x)}</span>`;
    let corpo = "";
    if (q.tp === "A") {
      corpo = `<div class="opts ce">${[0, 1].map(j => { let c = ""; if (done) { if (j === q.a) c = " is-right"; else if (j === r) c = " is-wrong"; }
        return `<button class="opt${c}" type="button" data-q="${i}" data-o="${j}" aria-pressed="${r === j}" ${done ? "disabled" : ""}><span class="bub">${CE[j]}</span><span>${j ? "Errado" : "Certo"}</span></button>`; }).join("")}
        ${done ? "" : '<span class="note">Em dúvida? Deixar em branco vale 0; errar desconta.</span>'}</div>`;
    } else if (q.tp === "C") {
      corpo = `<div class="opts">${q.o.map((o, j) => { let c = ""; if (done) { if (j === q.a) c = " is-right"; else if (j === r) c = " is-wrong"; }
        return `<button class="opt${c}" type="button" data-q="${i}" data-o="${j}" aria-pressed="${r === j}" ${done ? "disabled" : ""}><span class="bub">${L[j]}</span><span>${o}</span></button>`; }).join("")}</div>`;
    } else if (q.tp === "B") {
      const v = vazio(r) ? "" : String(r).padStart(3, "0");
      corpo = `<div class="bnum"><label for="b${i}">Sua resposta (de 000 a 999)</label>
        <input id="b${i}" class="bin${done ? (ok ? " is-right" : " is-wrong") : ""}" data-bq="${i}" inputmode="numeric" maxlength="3" autocomplete="off" value="${v}" placeholder="000" ${done ? "disabled" : ""}>
        ${done && !ok ? `<span class="bgab">Gabarito: <b>${gabTxt}</b></span>` : ""}
        ${done ? "" : '<span class="note">Marque os três algarismos, com zeros à esquerda quando preciso. Na prova, o erro não desconta.</span>'}</div>`;
    } else if (q.tp === "D") {
      const tx = (S.dtx[n] || {})[i] || "";
      corpo = `<div class="dsc"><label for="d${i}">Sua resposta${done ? "" : " (escreva aqui ou no caderno)"}</label>
        <textarea id="d${i}" data-dq="${i}" maxlength="2000" rows="5" ${done ? "readonly" : ""} placeholder="Desenvolva a resolução, com os cálculos e a conclusão.">${esc(tx)}</textarea></div>`;
    }
    const fb = !done ? "" : q.tp === "D" ? `<div class="fbk">
        <div class="dmod"><b>Resposta esperada</b>${q.mod.map(p => `<p>${p}</p>`).join("")}</div>
        <div class="dcrit"><b>Critérios de correção</b><ul>${q.crit.map((c, k) => `<li><b>${["Insuficiente (0)", "Parcial (1,5x)", "Completa (3x)"][k]}:</b> ${c}</li>`).join("")}</ul></div>
        ${gab ? "" : `<div class="dauto"><span>Compare com a resposta esperada e avalie a sua:</span>${["Insuficiente", "Parcial", "Completa"].map((t, k) => `<button type="button" class="btn ghost sm" data-dav="${i}" data-v="${k}" aria-pressed="${r === k}">${t}</button>`).join("")}</div>`}
        <span class="hab">${hBadge(q)}${esc(q.hab)}</span></div>`
      : `<div class="fbk">
        ${!gab && !ok && !br && q.tp === "C" && q.e && q.e[r] ? `<p class="bad"><b>O que deu errado:</b> ${q.e[r]}</p>` : ""}
        ${!gab && !ok && !br && q.tp === "B" && q.eb ? `<p class="bad"><b>Erros comuns:</b> ${q.eb}</p>` : ""}
        <p class="sol"><b>${q.tp === "A" ? "Justificativa" : "Resolução"}:</b> ${q.sol}</p>
        ${q.tp === "C" ? `<details class="dist"${!gab && !ok && !br ? " open" : ""}><summary>O raciocínio por trás de cada alternativa errada</summary><ul>${
          q.o.map((o, j) => j === q.a ? "" : `<li class="${j === r ? "mine" : ""}"><span class="bub">${L[j]}</span><span>${o}<small>${q.e[j]}${j === r ? " (sua marcação)" : ""}</small></span></li>`).join("")}</ul></details>` : ""}
        <span class="hab">${hBadge(q)}${esc(q.hab)}</span></div>`;
    return `${baseHTML(qs, i, one)}<article class="q${cls}" id="q${i}">
      <div class="q-h"><b>ITEM ${pad(i + 1)}</b>${tpChip(q)}${ofChip(q)}<span class="q-r">${nvChip(q)}${verdict}</span></div>
      <div class="txt">${q.t.map(t => `<p>${t}</p>`).join("")}</div>${tbl(q)}${fig(q, i)}
      ${q.c ? `<p class="cmd">${q.c}</p>` : ""}${corpo}${fb}</article>`;
  }

  function sheetHTML(a) {
    const r = answers(a.n), done = S.done[a.n], qs = QS(a);
    return qs.map((q, i) => {
      let cells = "";
      if (q.tp === "A" || q.tp === "C") {
        const opts = q.tp === "A" ? CE : L.slice(0, 4).split("");
        cells = opts.map((x, j) => { let c = ""; if (done) { if (r[i] === j) c = j === q.a ? " r" : " w"; else if (j === q.a) c = " miss"; } else if (r[i] === j) c = " on";
          return `<button class="sb${c}" type="button" data-q="${i}" data-o="${j}" aria-label="Item ${i + 1}, ${x}" ${done ? "disabled" : ""}>${x}</button>`; }).join("");
      } else if (q.tp === "B") {
        const v = vazio(r[i]) ? "···" : String(r[i]).padStart(3, "0");
        cells = `<span class="sbv${done ? (certo(q, r[i]) ? " r" : " w") : vazio(r[i]) ? "" : " on"}">${v}</span>`;
      } else {
        const tx = ((S.dtx[a.n] || {})[i] || "").trim();
        cells = `<span class="sbv${done ? (vazio(r[i]) ? " p" : r[i] === 2 ? " r" : r[i] === 1 ? " pp" : " w") : tx ? " on" : ""}">${done ? (vazio(r[i]) ? "avaliar" : ["0", "1,5x", "3x"][r[i]]) : tx ? "escrito" : "texto"}</span>`;
      }
      return `<div class="srow"><button class="sn" type="button" data-goq="${i}">${pad(i + 1)}</button><span class="stp">${q.tp}</span><span class="scells">${cells}</span></div>`;
    }).join("");
  }

  function resumoHTML(a) {
    const r = a.res;
    return `<article class="resumo">
      <div class="r-con">${r.c.map(([tt, x]) => `<section><h3>${esc(tt)}</h3><p>${x}</p></section>`).join("")}</div>
      <div class="r-form"><h3>Fórmulas e fatos-chave</h3><ul>${r.f.map(f => `<li>${f}</li>`).join("")}</ul></div>
      <div class="r-ex"><h3>Exemplo resolvido</h3><p>${r.ex[0]}</p><p class="sol"><b>Resolução:</b> ${r.ex[1]}</p></div>
      <div class="r-at"><h3>Atenção no PAS</h3><ul>${r.at.map(x => `<li>${x}</li>`).join("")}</ul></div>
      <div><button class="btn" type="button" data-mode="lista">Ir para a lista de itens</button></div>
    </article>`;

  // ---------- correção no padrão do PAS ----------
  const qref = i => `<a href="#q${i}" class="qlink">${pad(i + 1)}</a>`;
  function gruposLista(P) {
    const G = {};
    P.its.forEach(it => { const k = it.q.h || it.q.hab; (G[k] = G[k] || { h: it.q.h, hab: it.q.hab, its: [], u: 0, mx: 0 }); G[k].its.push(it); G[k].u += it.u; G[k].mx += it.mx; });
    return Object.values(G).map(g => Object.assign(g, { s: g.u / g.mx, st: stOf(g.u / g.mx) })).sort((x, y) => x.s - y.s);
  }
  const ondeTreinar = (h, n) => !h ? [] : AE(aula(n).et).map(b => ({ b, c: pool(b).filter(q => q.h === h).length })).filter(x => x.c && x.b.n !== n).sort((x, y) => y.c - x.c).slice(0, 2);
  function pasHTML(a) {
    const P = placar(a.n, S.ans), gs = gruposLista(P);
    const hist = (S.hist || []).filter(h => h.a === a.n).sort((x, y) => x.t - y.t);
    const tps = ["A", "B", "C", "D"].map(t => P.porTp[t]).filter(Boolean);
    const errA = P.its.filter(it => it.q.tp === "A" && !it.br && !it.ok).length, marA = P.its.filter(it => it.q.tp === "A" && !it.br).length;
    const taxaA = marA ? (marA - errA) / marA : null;
    const card = g => {
      const enc = (D.enc || {})[g.h], ond = g.st < 2 ? ondeTreinar(g.h, a.n) : [];
      const linhas = g.its.map(it => `<li>Item ${qref(it.i)} <span class="tpm">${it.q.tp}</span> · ${it.q.tp === "D" ? (it.br ? "a autoavaliar" : ["insuficiente", "parcial", "completa"][it.r]) : it.ok ? "certo" : it.br ? "em branco" : "errou"} <small>${ptsTxt(it.u, P.x)} de ${fmtE(r1(it.mx * P.x))} possíveis</small>${
        !it.ok && !it.br && it.q.tp === "C" && it.q.e[it.r] ? `<small class="dg">${it.q.e[it.r]}</small>` : ""}</li>`).join("");
      const guia = g.st === 0 ? (g.u < 0 ? "Saldo negativo: os erros descontaram mais do que os acertos somaram. Releia o resumo, refaça os itens pela justificativa e, na prova, só marque quando tiver segurança." : "Pouco aproveitamento nesta habilidade. Volte ao resumo teórico e ao exemplo resolvido; depois refaça a lista com foco nela.")
        : g.st === 1 ? "Aproveitamento parcial. Confira em que item a ideia escapou e treine itens parecidos: é onde a nota sobe mais rápido."
        : "Habilidade em dia nesta lista. Mantenha com itens de nível mais alto.";
      return `<section class="tcard s-${STC[g.st]}">
        <header>${g.h ? `<span class="hcode" title="${hTitle(g.h)}">${esc(g.h)}</span>` : ""}<b>${esc(g.h ? (D.hdesc[g.h] || g.hab) : g.hab)}</b><span class="tst">${STN[g.st]} · ${pctS(Math.max(0, g.s))}</span></header>
        <ul class="tq">${linhas}</ul><p class="tguia">${guia}</p>
        ${enc && g.st < 2 ? `<div class="tenc"><b>Como treinar</b><ul>${enc.p.map(x => `<li>${x}</li>`).join("")}</ul><p><b>Armadilha comum:</b> ${enc.arm}</p></div>` : ""}
        ${ond.length ? `<div class="tgo"><span>Treine também em:</span>${ond.map(x => `<button type="button" class="btn ghost sm" data-goaula="${x.b.n}">Aula ${lab(x.b)} · ${esc(x.b.tema)}</button>`).join("")}</div>` : ""}
      </section>`;
    };
    return `<section class="tri pas" aria-label="Correção no padrão do PAS">
      <div class="tri-h"><div><h3>Correção no padrão do PAS</h3><p class="note">Pontuação do edital: tipo A ±x, tipo B +2x, tipo C +2x ou −0,667x, tipo D até 3x. Nesta lista, x = ${fmtE(r1(P.x))}, para que o total possível seja 100.</p></div>
        <div class="tri-n"><b>${fmtE(P.esc)}</b><small>de 100 pontos</small></div></div>
      <div class="ptp">${tps.map(t => `<div><span class="tpc tp-${t.tp.toLowerCase()}">${TLC[t.tp]}</span><b>${fmtE(r1(t.u * P.x))}</b><small>${t.tp === "D" ? (t.b ? "a autoavaliar" : t.c ? "com pontuação" : "sem pontuação") : `${t.c} certo${t.c === 1 ? "" : "s"} · ${t.e} erro${t.e === 1 ? "" : "s"} · ${t.b} em branco`}</small></div>`).join("")}</div>
      ${P.dPend ? `<p class="warnx"><b>Falta a autoavaliação do item discursivo.</b> Compare sua resposta com a resposta esperada (item ${qref(P.its.findIndex(it => it.q.tp === "D"))}) e marque Completa, Parcial ou Insuficiente: o escore é atualizado na hora.</p>` : ""}
      <div class="tcoer">
        ${P.perdaChute ? `<p class="bad"><b>O custo dos erros:</b> ${P.perdaChute} ${P.perdaChute === 1 ? "item errado de tipo A ou C descontou" : "itens errados de tipo A ou C descontaram"} pontos. Se ${P.perdaChute === 1 ? "ele tivesse ficado" : "eles tivessem ficado"} em branco, o escore seria <b>${fmtE(P.semChute)}</b>.</p>` : `<p class="ok-msg">Nenhum item de tipo A ou C errado: nada foi descontado nesta lista.</p>`}
        ${taxaA != null ? `<p class="${taxaA >= 0.5 ? "note" : "bad"}">Nos itens de tipo A que você marcou, acertou ${pctS(taxaA)}. ${taxaA >= 0.75 ? "Ótimo índice: marcar está valendo a pena." : taxaA >= 0.5 ? "Cada erro anula um acerto: vale marcar só quando você consegue justificar." : "Abaixo de 50%, marcar está tirando pontos. Deixe em branco os itens em que você não consegue justificar a resposta."}</p>` : ""}
      </div>
      ${hist.length > 1 ? `<div class="tsum"><span>Nesta aula: ${hist.map(x => `${x.t}ª tentativa <b>${fmtE(x.p)}</b>`).join(" → ")}</span></div>` : ""}
      <h4>Encaminhamentos por habilidade da Matriz</h4>
      <div class="tcards">${gs.map(card).join("")}</div>
      <details class="tcomo"><summary>Como o PAS pontua</summary>
        <p>No PAS, o tipo A é julgado como certo ou errado: o acerto vale x e o erro tira x, então um erro anula um acerto. O tipo B pede um número de 000 a 999 e vale 2x, sem desconto. O tipo C tem quatro alternativas, vale 2x e o erro tira 0,667x. O tipo D é discursivo, corrigido por critérios, e vale até 3x.</p>
        <p>O valor de x faz a prova valer 100 pontos: (itens A + 2·B + 2·C + 3·D)·x = 100. Nesta revisão, a mesma regra vale para cada lista de 12 itens. Deixar em branco nunca desconta: marque quando conseguir justificar.</p>
        <p>O argumento final do PAS soma as três etapas com pesos 1, 2 e 3. Este escore é um treino para orientar o estudo, não a nota oficial.</p></details>
    </section>`;
  }
  const toTri = () => { const el = document.querySelector("#main .tri"); if (el) el.scrollIntoView({ block: "start", behavior: "smooth" }); };

  // ---------- lista com foco: ênfase nas habilidades com menor aproveitamento ----------
  function focoInfo(n) {
    const P = placar(n, S.ans), gs = gruposLista(P).filter(g => g.h && g.st < 2);
    const hs = gs.map(g => g.h);
    const lh = new Set(pool(aula(n)).map(q => q.h));
    diag(S.ans, S.done, undefined, aula(n).et).filter(g => lh.has(g.h) && g.s < 0.5 && !hs.includes(g.h)).forEach(g => hs.push(g.h));
    return { hs: hs.slice(0, 4), esc: P.esc };
  }
  function refazerFoco(n) {
    const info = focoInfo(n), pesos = {};
    info.hs.forEach((h, k) => { pesos[h] = 4 - k; });
    const set = sortear(n, pesos);
    S.done[n] = false; S.ans[n] = {}; S.cur[n] = 0; S.sets[n] = set; S.tent[n] = tentOf(n) + 1; if (S.dtx[n]) delete S.dtx[n];
    S.foco = S.foco || {}; S.foco[n] = { hs: info.hs, esc: info.esc, t: S.tent[n] };
    if (S.mode === "resumo") S.mode = "lista";
    renderAll(); persist(); document.getElementById("main").scrollIntoView({ block: "start" });
  }
  function focoHTML(a) {
    const info = focoInfo(a.n);
    const alvo = info.hs.length ? info.hs.map(h => `<span class="hcode" title="${hTitle(h)}">${esc(h)}</span>`).join(" ") : "";
    return `<div class="foco"><h4>Próxima lista</h4>
      <button class="btn" type="button" id="redoFoco">Nova lista com foco no que errei</button>
      <p class="note">${info.hs.length ? `Os textos e itens sorteados priorizam ${alvo}, sempre no formato do PAS (8 itens A, 2 C, 1 B e 1 D).` : "Você foi bem em todas as habilidades desta lista: a nova lista sorteia outros textos e itens da aula."}</p></div>`;
  }

  // ---------- aula aberta ----------
  let pendingCorrect = false, pendingReset = false;
  function syncLine() {
    if (teacherUI() && !perfil) return "";
    if (cloud === "on" && !domainOk()) return `<p class="note">Progresso salvo só neste navegador.</p>`;
    if (cloud === "on" && perfil) return `<p class="note">Progresso salvo na conta de ${esc(perfil.email)}.</p>`;
    if (guest) return `<p class="warn">Sem e-mail: estas respostas não ficam salvas.</p>`;
    if (localMode()) return `<p class="note">Progresso salvo neste aparelho${perfil ? " para " + esc(perfil.email) : ""}.</p>`;
    return "";
  }
  function escolhaHTML() {
    return `<section class="escolha"><h2>Qual etapa você vai revisar?</h2>
      <p class="note">Cada etapa tem 12 aulas pela Matriz de Referência do PAS/UnB, com listas no formato da prova (itens dos tipos A, B, C e D). Dá para trocar de etapa quando quiser, pelo seletor no topo.</p>
      <div class="ecards">${ETS.map(e => { const E = D.et[e], d = diasAte(E.prova); return `<button class="ecard" type="button" data-etapa="${e}">
        <b>${esc(E.nome)}</b><span>${esc(E.serie)} · prova em ${fmtD(E.prova)}${d > 0 ? ` · faltam ${d} dias` : ""}</span>
        <small>${esc(E.temas)}</small><small>Revisão de ${ddmm(E.ini)} a ${ddmm(E.fim)}, de segunda a sábado</small></button>`; }).join("")}</div></section>`;
  }
  function cardHTML(a) {
    const done = S.done[a.n], k = nAns(a.n), gab = S.mode === "gab", qs = QS(a);
    let side;
    if (gab) {
      side = `<h4 style="margin:0">Gabarito</h4>
        <div class="gabk">${qs.map((q, i) => `<span><b>${pad(i + 1)}</b> ${q.tp === "A" ? CE[q.a] : q.tp === "B" ? String(q.a).padStart(3, "0") : q.tp === "C" ? L[q.a] : "D"}</span>`).join("")}</div>
        <p class="note">Modo professor: cada item mostra o gabarito, a justificativa e, no tipo C, o raciocínio de cada alternativa errada.</p>
        <p class="note">Banco desta aula: ${pool(a).length} itens. Esta é a sequência ${S.sets[a.n] ? "sorteada" : "inicial"}.</p>
        <button class="btn ghost" type="button" id="novaSeq">Ver outra sequência do banco</button>`;
    } else if (done) {
      const P = placar(a.n, S.ans), gs = gruposLista(P).filter(g => g.st < 2);
      side = `<div class="score">${fmtE(P.esc)}<small> / 100</small></div>
        <p class="tri-s">${P.ac} de ${NQ} itens certos${P.dPend ? " · falta autoavaliar o tipo D" : ""} <button type="button" class="lnk" data-totri="1">ver correção</button></p>
        ${P.perdaChute ? `<p class="note">Sem os ${P.perdaChute} erros de A e C (em branco), seria ${fmtE(P.semChute)}.</p>` : ""}
        <div class="reforco"><h4>Habilidades para reforçar</h4>
          ${gs.length ? `<ul>${gs.map(g => `<li>${g.h ? `<span class="hcode" title="${hTitle(g.h)}">${esc(g.h)}</span> ` : ""}${esc(D.hdesc[g.h] || g.hab)}<small>Aproveitamento ${pctS(Math.max(0, g.s))}</small></li>`).join("")}</ul>
            <button class="btn ghost" type="button" data-mode="resumo">Rever o resumo teórico</button>`
            : '<p class="ok-msg">Bom aproveitamento em todas as habilidades desta lista.</p>'}</div>
        <div class="pdfl"><div class="row"><button class="btn ghost" type="button" id="pdfLista">Baixar PDF desta lista</button><button class="btn ghost" type="button" id="telaLista">Ver na tela</button></div>${pdfL && pdfL.n === a.n ? `<p class="${pdfL.ok ? "ok-msg" : "warn"}">${esc(pdfL.t)}</p>` : '<p class="note">Item por item: tipo, habilidade, sua marcação, gabarito, pontos e justificativa.</p>'}</div>
        ${focoHTML(a)}<button class="btn ghost" type="button" id="redo">Refazer com nova sequência</button>
        <p class="note">Cada sequência traz 2 textos com 4 itens de tipo A, 2 itens de tipo C, 1 de tipo B e 1 discursivo, sorteados do banco desta aula.</p>`;
    } else if (pendingCorrect) {
      const vz = NQ - k;
      side = `<p class="note">${vz} ${vz === 1 ? "item está" : "itens estão"} em branco. No PAS, item em branco vale 0 e não desconta.</p>
        <button class="btn" type="button" id="doCorrect">Corrigir assim</button>
        <button class="btn ghost" type="button" id="cancel">Voltar a responder</button>`;
    } else {
      side = `<p class="note">${k}/${NQ} respondidos. Marque aqui ou nos itens.</p>
        <button class="btn" type="button" id="correct" ${k === 0 ? "disabled" : ""}>Corrigir lista</button>`;
    }
    return `<aside class="card" aria-label="Folha de respostas">
          <h3>${gab ? "Modo professor" : "Folha de respostas"}</h3>
          ${gab ? "" : `<div class="sheetp">${sheetHTML(a)}</div>`}
          ${side}
          ${syncLine()}
        </aside>`;
  }
  function renderMain() {
    const main = document.getElementById("main");
    if (!S.etapa) { main.innerHTML = ""; return; }
    const a = aula(selOf()), done = S.done[a.n], k = nAns(a.n);
    const wk = ETD().semanas.find(w => w.ns.includes(a.n));
    const one = S.mode === "uma";
    const cur = Math.min(S.cur[a.n] || 0, NQ - 1);
    if (S.mode === "gab" && !teacherUI()) S.mode = "lista";

  // ---------- histórico de tentativas: dados que mantêm as listas comparáveis ----------
  // every corrected attempt keeps stable item ids, the item type, the answer and the units earned,
  // so the escore of any attempt can be recomputed and compared with any other
  const hsh = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  const qid = q => q._id || (q._id = String(q.g || "q").slice(0, 24) + "~" + hsh(JSON.stringify([q.t, q.c, q.o, q.base])));
  let QIX = null;
  const qix = () => QIX || (QIX = (() => { const m = {}; D.aulas.forEach(a => pool(a).forEach(q => { const k = qid(q); if (!m[k]) m[k] = { q, n: a.n }; })); return m; })());
  const TIPO = { s: "sorteio", f: "lista com foco", r: "anterior ao histórico" };
  function entradaHist(n, ans, sets, tent, foco, d) {
    const P = placar(n, ans, sets), fo = foco && foco[n] && foco[n].t === tent ? foco[n] : null;
    return { a: n, et: aula(n).et, t: tent, d: d || null, k: d ? (fo ? "f" : "s") : "r", fh: fo ? fo.hs : [],
      it: P.its.map(x => [qid(x.q), x.q.h || "", x.q.tp, x.br ? -1 : x.r, x.q.a, x.u, x.mx]), p: P.esc, x: r1(P.x * 1000) / 1000 };
  }
  function registraHist(n) {
    S.hist = (S.hist || []).filter(h => !(h.a === n && h.t === tentOf(n)));
    S.hist.push(entradaHist(n, S.ans, S.sets, tentOf(n), S.foco, new Date().toISOString()));
    if (S.hist.length > 400) S.hist.splice(0, S.hist.length - 400);
  }
  function histDe(rec, et) {
    const h = Array.isArray(rec.hist) ? rec.hist.filter(x => x && x.a && aula(x.a)) : [];
    const out = h.slice();
    D.aulas.forEach(a => {
      const n = a.n, tent = (rec.tent && rec.tent[n]) || 1;
      if (rec.done && rec.done[n] && !h.some(x => x.a === n && x.t === tent)) { try { out.push(entradaHist(n, rec.ans || {}, rec.sets || {}, tent, rec.foco, null)); } catch (e) {} }
    });
    return out.filter(x => !et || aula(x.a).et === et).sort((x, y) => (x.d || "").localeCompare(y.d || "") || x.a - y.a || x.t - y.t);
  }
  function ultimas(hist, filtro) { const m = {}; hist.forEach(h => (h.it || []).forEach(it => { if (!filtro || filtro(it)) m[it[0]] = it; })); return Object.values(m); }
  const saldoIt = arr => { const mx = arr.reduce((s, it) => s + it[6], 0); return mx ? arr.reduce((s, it) => s + it[5], 0) / mx : 0; };
  const okIt = it => it[3] !== -1 && (it[2] === "D" ? it[3] === 2 : it[2] === "B" ? +it[3] === it[4] : it[3] === it[4]);
  function porHabilidade(hist) {
    const H = {};
    hist.forEach((h, k) => (h.it || []).forEach(it => { if (!it[1]) return; (H[it[1]] = H[it[1]] || { h: it[1], ks: new Set() }).ks.add(k); }));
    return Object.values(H).map(g => {
      const lat = ultimas(hist, it => it[1] === g.h), ks = [...g.ks].sort((x, y) => x - y);
      const prim = (hist[ks[0]].it || []).filter(it => it[1] === g.h);
      return { h: g.h, n: lat.length, ac: lat.filter(okIt).length, agora: saldoIt(lat), ini: ks.length > 1 ? saldoIt(prim) : null, nt: ks.length };
    }).sort((x, y) => x.agora - y.agora);
  }
  function porAula(hist) {
    return D.aulas.map(a => { const l = hist.filter(h => h.a === a.n && h.p != null); return l.length ? { n: a.n, k: l.length, pri: l[0].p, ult: l[l.length - 1].p, mel: Math.max(...l.map(h => h.p)) } : null; }).filter(Boolean);
  }
  function graficoEvol(hist) {
    const pts = hist.filter(h => h.p != null);
    if (!pts.length) return "";
    const Wd = 560, Hd = 210, L0 = 40, R0 = 12, T0 = 14, B0 = 30;
    const vals = pts.map(h => h.p), lo = Math.min(0, Math.floor(Math.min(...vals) / 20) * 20), hi = 100;
    const X = i => pts.length === 1 ? (L0 + Wd - R0) / 2 : L0 + i * (Wd - L0 - R0) / (pts.length - 1), Y = v => T0 + (hi - v) * (Hd - T0 - B0) / (hi - lo);
    let g = "";
    for (let v = lo; v <= hi; v += 20) g += `<line x1="${L0}" x2="${Wd - R0}" y1="${Y(v)}" y2="${Y(v)}" class="gl${v === 0 ? " z" : ""}"/><text x="${L0 - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${v}</text>`;
    // moving mean of the last three lists
    const mm = pts.map((h, i) => { const w = pts.slice(Math.max(0, i - 2), i + 1); return w.reduce((s, x) => s + x.p, 0) / w.length; });
    const line = mm.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    const dots = pts.map((h, i) => `<circle cx="${X(i)}" cy="${Y(h.p)}" r="5" class="dt${h.d ? "" : " leg"}"><title>Aula ${lab(aula(h.a))} · tentativa ${h.t}${h.d ? " · " + new Date(h.d).toLocaleDateString("pt-BR") : ""} · escore ${fmtE(h.p)}</title></circle>

  }

  function evolucaoHTML() {

    const pa = porAula(hist), ph = porHabilidade(hist);

      <tbody>${pa.map(x => `<tr><td>${lab(aula(x.n))} · ${esc(aula(x.n).tema)}</td><td class="c">${x.k}</td><td class="c">${fmtE(x.pri)}</td><td class="c"><b>${fmtE(x.ult)}</b></td><td class="c">${x.k > 1 ? delta(x.pri, x.ult) : "—"}</td><td class="c">${fmtE(x.mel)}</td></tr>`).join("")}</tbody></table></div>
      <h3 class="sm">Por habilidade da Matriz</h3><div class="tblwrap"><table class="evt"><thead><tr><th>Habilidade</th><th class="c">Itens</th><th class="c">Certos</th><th class="c" title="Pontos obtidos sobre o máximo, com a última resposta de cada item">Aproveitamento</th><th class="c" title="Comparação com a primeira lista em que a habilidade apareceu">Desde o início</th></tr></thead>
      <tbody>${ph.map(x => `<tr><td><span class="hcode" title="${hTitle(x.h)}">${esc(x.h)}</span> ${esc((D.hdesc[x.h] || "").slice(0, 80))}</td><td class="c">${x.n}</td><td class="c">${x.ac}</td><td class="c"><b>${pctS(x.agora)}</b></td><td class="c">${x.ini == null ? "—" : delta(x.ini, x.agora, true)}</td></tr>`).join("")}</tbody></table></div>

  }
  // ---------- turma ----------
  const origemTxt = q => q.of ? q.of.src : q.insp ? "Modelado de " + q.insp : "Inédito";
  function turmaHTML(rows, et) {
