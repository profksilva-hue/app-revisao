<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revisão PAS/UnB</title>
<meta name="theme-color" content="#005084">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
:root { --paper:#F3F6F9; --sheet:#FFFFFF; --ink:#0E2A3B; --ink-2:#4A5F70; --rule:#D3DDE5; --pen:#005084; --mark:#8A5F08; --mark-soft:#F8F1E0; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --paper:#0A1822; --sheet:#10222F; --ink:#E4EDF3; --ink-2:#A2B5C3; --rule:#23394A; --pen:#6FB3E0; --mark:#E5B84B; --mark-soft:#3A2E12; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
  font: 15px/1.5 "Archivo", system-ui, sans-serif; padding: 24px 16px; }
.box { max-width: 480px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
.tag { align-self: start; font: 700 10.5px/1 "Archivo", sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; color: var(--mark); background: var(--mark-soft); }
h1 { font-stretch: 75%; font-weight: 800; font-size: 40px; line-height: 1; margin: 0; }
p { margin: 0; color: var(--ink-2); }
a { color: var(--pen); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <!-- Quando a revisão do PAS estiver pronta, substitua este arquivo pelo app do PAS
       (mesmo processo usado em enem/index.html). -->
  <div class="box">
    <span class="tag">Em breve</span>
    <h1>Revisão PAS/UnB</h1>
    <p>Esta área vai reunir a revisão de Matemática organizada pela Matriz de Referência do PAS, com questões nos formatos da prova.</p>
    <a href="../">← Voltar ao início</a>
  </div>
</body>
</html>
